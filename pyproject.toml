[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgmcp"
version = "0.1.0"
requires-python = ">=3.12"
# Telethon is pinned to the minor version the read-only guard was checked against: it overrides
# the private TelegramClient._call and uses Message._finish_init.
dependencies = ["telethon>=1.45,<1.46", "mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
dev = ["ruff>=0.6,<0.18", "mypy>=1.11,<3"]

[project.scripts]
tgmcp = "tgmcp.cli:main"

[tool.setuptools.packages.find]
include = ["tgmcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: talks to the real Telegram account, skipped without a session"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "PL", "T20", "N", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
"tgmcp/host/benchdata.py" = ["PLR2004", "RUF001"]  # fixture data: Cyrillic text, seed ids
"check.py" = ["T20"]
"tgmcp/cli.py" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["tgmcp", "tests", "check.py"]

[[tool.mypy.overrides]]
module = "telethon.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests are type-checked, but pytest fixtures and parametrised cases may stay unannotated.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
